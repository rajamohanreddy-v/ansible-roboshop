- name: catalogue setup
  hosts: catalogue
  become: yes
  tasks: 
    - name: enabling nodejs 20 version
      ansible.builtin.command: dnf module enable nodejs:20 -y
      
    - name: install nodejs
      ansible.builtin.dnf:
        name: nodejs
        state: present

    - name: create system user
      ansible.builtin.user:
        name: roboshop
        system: true
        home: /app
        shell: /sbin/nologin
        comment: "Roboshop system user"
      
    - name: remove /app directory
      ansible.builtin.file:
        path: /app
        state: absent

    - name: create /app directory 
      ansible.builtin.file:
        path: /app
        state: directory

    - name: delete catalogue
      ansible.builtin.file:
        path: /tmp/catalogue.zip
        state: absent

    - name: download the catalogue
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip 
        dest: /tmp/catalogue.zip

    - name: unarchive the code
      ansible.builtin.unarchive:
        src: /tmp/catalogue.zip
        dest: /app
        remote_src: yes

    - name: Install dependencies
      community.general.npm:
        path: /app
    
    - name: copy service file
      ansible.builtin.copy:
        src: catalogue.service
        dest: /etc/systemd/system/catalogue.service
    
    - name: copy mongodb repo
      ansible.builtin.copy:
        src: mongo.repo
        dest: /etc/yum.repos.d/mongo.repo

    - name: install mongodb
      ansible.builtin.dnf:
        name: mongodb-mongosh
        state: present

    - name: check products loaded or not
      ansible.builtin.command: mongosh --host "{{ MONGODB_HOST }}" --quiet  --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
      register: catalogue_output

    - name: load the products
      ansible.builtin.shell: mongosh --host "{{ MONGODB_HOST }}" </app/db/master-data.js
      when: catalogue_output.stdout  | int < 0

    - name: Restart services
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: start catalogue
      ansible.builtin.service:
        name: catalogue
        state: restarted
        enabled: yes

    

    