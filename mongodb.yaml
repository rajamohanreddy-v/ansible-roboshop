- name: mongodb setup
  hosts: mongodb
  become: yes
  tasks:
    - name: copy mongodb repo
      ansible.builtin.copy:
        src: mongo.repo
        dest: /etc/yum.repos.d/mongo.repo

    - name: install mongodb
      ansible.builtin.dnf:
        name: mongodb-org
        state: present

    - name: allow traffic on internet
      ansible.builtin.replace:
        path: /etc/mongod.conf
        regexp: '127.0.0.0'
        replace: '0.0.0.0'
    
    - name: start and enable mongodb
      ansible.builtin.service:
        name: mongod
        enabled: yes
        state: restarted
      
